name: heartstake

services:
  backend:
    image: ghcr.io/hurritech/heartstake-backend:${IMAGE_TAG:?required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: heartstake.sevenna.de
      DATABASE_PATH: /data/db.sqlite3
      WEB_CONCURRENCY: "2"
    volumes:
      - backend_data:/data
      - static_data:/app/staticfiles
    networks:
      - internal

  frontend:
    image: ghcr.io/hurritech/heartstake-frontend:${IMAGE_TAG:?required}
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/heartstake-static:ro
    networks:
      internal:
      public_proxy:
        aliases:
          - heartstake-web

volumes:
  backend_data:
  static_data:

networks:
  internal:
    internal: true
  public_proxy:
    external: true
    name: proxy